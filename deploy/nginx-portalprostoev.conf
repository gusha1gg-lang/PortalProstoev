# Настройка nginx для портала: HTTPS + отдача статики + передача запросов в gunicorn.
#
# Куда положить на сервере (Oracle Linux):  /etc/nginx/conf.d/portalprostoev.conf
# Проверить и применить:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Замените под себя:
#   portal.company.local        — адрес (доменное имя) портала
#   /etc/pki/tls/certs/portal.crt и .../portal.key — сертификат и ключ (запросить у ИТ-службы)
#   /opt/portalprostoev/staticfiles/  — папка со статикой (создаётся командой collectstatic)

# HTTP → HTTPS
server {
    listen 80;
    server_name portal.company.local;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name portal.company.local;

    ssl_certificate     /etc/pki/tls/certs/portal.crt;
    ssl_certificate_key /etc/pki/tls/private/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # Статику (стили, библиотека графиков) отдаёт сам nginx — это быстрее.
    location /static/ {
        alias /opt/portalprostoev/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Всё остальное — в приложение (gunicorn на 127.0.0.1:8000).
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ВАЖНО: эта строка сообщает Django, что снаружи HTTPS.
        # Без неё будет бесконечный редирект (см. SECURE_PROXY_SSL_HEADER в config/settings/prod.py).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

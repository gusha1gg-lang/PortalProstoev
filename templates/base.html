{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PortalProstoev{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="brand">Портал учёта простоев по вине ИТ</div>

            <a href="{% url 'reports:dashboard' %}">Дашборд</a>

            <a href="{% url 'reports:sla_report' %}">SLA-отчёт</a>
            <a href="{% url 'notifications:log' %}">Уведомления</a>

        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
